<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=ps-consumers-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA & iOS Mobile Web App Fullscreen Capabilities -->
    <link rel="manifest" href="/manifest.json?v=ps-consumers-1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="K COFFEE" />
    <meta name="application-name" content="K COFFEE" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    
    <!-- Opaque square brand icon for iOS and installed desktop apps. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=ps-consumers-1" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>K COFFEE</title>
    <!-- Custom Calendar Plugin -->
    <link rel="stylesheet" href="/calendar/calendar.css" />
    <script src="/calendar/calendar-wrapper.js"></script>
    <script src="/calendar/calendar.js"></script>
    <script>
      // Make openCalendar globally available for TypeScript
      window.openCalendar = window.openCalendar || function(){};

      // Auto-remove extension injected elements (e.g., #autotdk_ext)
      (function() {
        const removeExt = () => {
          document.querySelectorAll('#autotdk_ext, [id*="autotdk"]').forEach(el => el.remove());
        };
        removeExt();
        const observer = new MutationObserver(removeExt);
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
